apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: yopass
  namespace: yopass
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: yopass
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 50% of the cpu request (50m) from deployment.yaml
          averageUtilization: 50
