apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
  namespace: yopass
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:latest
          args: ["run", "/scripts/k6-script.js"]
          env:
            - name: BASE_URL
              value: "http://yopass"
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: k6-script
